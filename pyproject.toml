[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llmSHAP*", "ghost_test_catcher*"]

[project]
name = "ghost-test-catcher"
version = "0.1.0"
description = "Ghost Test Catcher verifies whether AI-generated Python tests are grounded in real source evidence."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Carl Svaerd" },
  { name = "Filip Naudot" },
]
maintainers = [
  { name = "Carl Svaerd" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "tqdm",
]

[project.optional-dependencies]
openai     = ["openai", "python-dotenv"]
embeddings = ["sentence-transformers", "numpy"]
codebase   = ["openai", "python-dotenv", "scikit-learn"]
webapp     = ["openai", "python-dotenv", "fastapi", "uvicorn", "python-multipart", "pytest"]
ghost      = ["pytest"]
dev        = ["pytest", "matplotlib", "ipywidgets", "sphinx", "myst-parser", "sphinx-book-theme", "sphinx-design"]
all        = ["openai", "python-dotenv", "numpy", "scikit-learn", "fastapi", "uvicorn", "python-multipart", "pytest"]

[project.scripts]
ghost-test-catcher = "ghost_test_catcher.cli:main"

[project.urls]
Homepage = "https://github.com/CarlSvaerd/HackathonWasp"
Repository = "https://github.com/CarlSvaerd/HackathonWasp"
Documentation = "https://github.com/CarlSvaerd/HackathonWasp/blob/main/docs/ghost-test-catcher.rst"
Issues = "https://github.com/CarlSvaerd/HackathonWasp/issues"

[tool.ghost-test-catcher]
source_paths = ["src"]
test_paths = ["tests"]
test_mode = "mixed"
model = "gpt-4o-mini"
max_files = 80
max_chars_per_file = 24000
max_total_chars = 240000
execute_tests = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".pytest_cache",
  "build",
  "dist",
  "docs/_build",
  "demo/ghost_test_catcher_sample",
  "demo/ghost_risk_sample",
  "demo/allofem",
]
