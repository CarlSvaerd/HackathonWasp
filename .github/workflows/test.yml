name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.11, 3.12, 3.13]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[all,dev]"

      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings -q

      - name: Run Ghost Test Catcher calibration
        run: python -m ghost_test_catcher.cli calibrate --format pretty

      - name: Smoke test Ghost Test Catcher CLI
        run: |
          python -m ghost_test_catcher.cli analyze \
            --repo . \
            --tests tests/test_webapp_execution.py \
            --source src \
            --no-execution \
            --format json

      - name: Run Ghost Test Catcher CI gate
        run: |
          python -m ghost_test_catcher.cli ci \
            --repo . \
            --tests tests/test_webapp_execution.py \
            --source src \
            --no-execution \
            --summary ghost-test-catcher-summary.md \
            --output ghost-test-catcher-report.json \
            --format json \
            --fail-on ghost_risk

      - name: Publish Ghost Test Catcher step summary
        run: cat ghost-test-catcher-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Ghost Test Catcher report
        uses: actions/upload-artifact@v4
        with:
          name: ghost-test-catcher-report-${{ matrix.python-version }}
          path: |
            ghost-test-catcher-summary.md
            ghost-test-catcher-report.json

  vscode-extension:
    name: Check VS Code extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        working-directory: packages/vscode-extension
        run: npm install --ignore-scripts

      - name: Check extension JavaScript
        working-directory: packages/vscode-extension
        run: npm run check

      - name: Run extension unit tests
        working-directory: packages/vscode-extension
        run: npm run test:unit

      - name: Package extension
        working-directory: packages/vscode-extension
        run: npx vsce package --no-dependencies --out ghost-test-catcher-0.1.0.vsix

      - name: Upload VS Code extension VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ghost-test-catcher-vsix
          path: packages/vscode-extension/ghost-test-catcher-0.1.0.vsix

  vscode-extension-integration:
    name: VS Code integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ghost Test Catcher CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ghost]"

      - name: Smoke test public CLI module
        run: python -m ghost_test_catcher.cli doctor --repo .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        working-directory: packages/vscode-extension
        run: npm install --ignore-scripts

      - name: Run VS Code integration tests on Linux
        if: runner.os == 'Linux'
        working-directory: packages/vscode-extension
        run: xvfb-run -a npm run test:integration
        env:
          GHOST_TEST_CATCHER_TEST_PYTHON: python

      - name: Run VS Code integration tests
        if: runner.os != 'Linux'
        working-directory: packages/vscode-extension
        run: npm run test:integration
        env:
          GHOST_TEST_CATCHER_TEST_PYTHON: python
